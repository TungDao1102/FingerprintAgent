name: E2E Tests

# D-23: Manual trigger via workflow_dispatch only.
# Playwright + agent install is heavy (~10-15 min per run).
# Operator runs this before tagging a release to validate the full
# browser -> agent -> mock backend flow on a real MSI-installed service.
on:
  workflow_dispatch:

# Concurrency: cancel any in-progress run when a new one is triggered.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

# Minimal permissions — checkout only.
permissions:
  contents: read

jobs:
  e2e:
    name: Playwright end-to-end tests on Windows MSI install
    runs-on: windows-latest  # FingerprintAgent is Windows-only
    timeout-minutes: 30

    env:
      MSI_PATH: 'installer/bin/Release/FingerprintAgent-Setup.msi'
      SERVICE_NAME: 'FingerprintAgent'

    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@9eae3fe338f7afea848fcd19cba99fdd34e92a62 # v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup Node.js 22
        uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6 # v4
        with:
          node-version: '22'

      # Restore + build the .NET solution that the MSI bundles.
      - name: Restore solution
        run: dotnet restore FingerprintAgent.sln

      - name: Build solution (Release)
        run: dotnet build FingerprintAgent.sln -c Release --no-restore

      # Verify the xUnit suite is green before we trust the E2E flow.
      - name: Run xUnit tests
        run: dotnet test tests/FingerprintAgent.Tests/FingerprintAgent.Tests.csproj -c Release --no-build --verbosity normal

      # Build the MSI. The .wixproj requires WixToolPath pointing at a
      # WiX 3.x install (downloaded below) since it's a legacy non-SDK project.
      - name: Install WiX 3.14.1 toolchain
        uses: ./.github/actions/install-wix314

      # '0.0.0-e2e' marks this as an ephemeral CI build. MSI ProductVersion only
      # accepts numeric x.x.x — the .wixproj strips the '-e2e' prerelease suffix
      # (candle CNDL0108) before invoking candle.exe.
      - name: Build MSI
        run: dotnet build installer/FingerprintAgent.Installer.wixproj -c Release --no-restore /p:WixToolPath=C:\wix314 /p:Version=0.0.0-e2e

      - name: Verify MSI artifact
        shell: pwsh
        run: |
          if (-not (Test-Path $env:MSI_PATH)) {
            Write-Error "MSI not found at $env:MSI_PATH"
            exit 1
          }
          $size = (Get-Item $env:MSI_PATH).Length
          Write-Host "MSI artifact: $env:MSI_PATH ($size bytes)"

      # Install the MSI silently. WiX /qn mode skips all UI (D-08).
      # /l*v install.log gives a verbose log we can inspect on failure.
      # CheckVcRedist custom action hard-fails the install when the VC++ x86
      # runtime is absent (D-09 — deliberate for hospital workstations). Clean
      # runners don't guarantee it, so make the condition true beforehand.
      # Same registry probe as CustomActions.IsVcRedistInstalled.
      - name: Ensure VC++ x86 redistributable
        shell: pwsh
        run: |
          $keys = @(
            'HKLM:\SOFTWARE\Microsoft\VisualStudio\14.0\VC\Runtimes\x86',
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\VisualStudio\14.0\VC\Runtimes\x86'
          )
          foreach ($key in $keys) {
            $v = (Get-ItemProperty -Path $key -ErrorAction SilentlyContinue).Installed
            if ($v -eq 1) { Write-Host "VC++ x86 already present at $key"; exit 0 }
          }
          Write-Host 'VC++ x86 not found - installing silently...'
          Invoke-WebRequest -Uri 'https://aka.ms/vs/17/release/vc_redist.x86.exe' -OutFile "$env:TEMP\vc_redist.x86.exe"
          $p = Start-Process -FilePath "$env:TEMP\vc_redist.x86.exe" -ArgumentList '/install', '/quiet', '/norestart' -Wait -PassThru
          Write-Host "vc_redist.x86 exit code: $($p.ExitCode)"
          exit $p.ExitCode

      - name: Install MSI (silent)
        shell: pwsh
        run: |
          Write-Host "Installing MSI silently..."
          # msiexec rejects forward slashes and relative paths in the package path
          # (internal error 1324 -> msiexec exit 1619 "package could not be opened"),
          # so resolve to an absolute backslash path before invoking it.
          $msi = (Resolve-Path $env:MSI_PATH).Path
          Write-Host "MSI: $msi"
          $proc = Start-Process -FilePath 'msiexec.exe' `
            -ArgumentList "/i `"$msi`" /qn /l*v install.log" `
            -Wait -PassThru -NoNewWindow
          Write-Host "msiexec exit code: $($proc.ExitCode)"
          if ($proc.ExitCode -ne 0) {
            # Dump the tail of the verbose log inline so the failure reason is
            # visible in the job summary without downloading artifacts.
            if (Test-Path install.log) {
              Write-Host "--- Last 80 lines of install.log ---"
              Get-Content install.log -Tail 80 | ForEach-Object { Write-Host $_ }
            }
            Write-Error "MSI install failed (exit code $($proc.ExitCode)). See install.log."
            exit $proc.ExitCode
          }

      # Start the service explicitly (Start=auto should already start it,
      # but be explicit so a slow service registration doesn't trip the
      # /health wait loop).
      - name: Start FingerprintAgent service
        shell: pwsh
        run: |
          Write-Host "Starting service '$env:SERVICE_NAME'..."
          Start-Service -Name $env:SERVICE_NAME -ErrorAction Stop
          $svc = Get-Service -Name $env:SERVICE_NAME
          Write-Host "Service status: $($svc.Status)"

      # E-2: flip mockMode in ProgramData only (not the shipped config) so the
      # Playwright suite can capture without a real USB scanner. ConfigFileWatcher
      # picks up the change within 300ms — no service restart needed.
      - name: Enable scanner.mockMode for E2E
        shell: pwsh
        run: |
          $configPath = 'C:\ProgramData\FingerprintAgent\config.json'
          if (-not (Test-Path $configPath)) {
            Write-Error "Expected ProgramData config at $configPath — did the MSI install fail?"
            exit 1
          }
          $json = Get-Content -Raw $configPath | ConvertFrom-Json
          $json.scanner.mockMode = $true
          $json | ConvertTo-Json -Depth 10 | Set-Content -Path $configPath -Encoding UTF8
          Write-Host "scanner.mockMode flipped to true in $configPath"

      # Wait for /health to respond. Agent takes a few seconds to bind to 5043
      # after the service transitions to Running. 30 attempts x 1s = 30s budget.
      - name: Wait for agent /health to respond
        shell: pwsh
        run: |
          $ready = $false
          for ($i = 0; $i -lt 30; $i++) {
            try {
              $resp = Invoke-WebRequest -Uri 'http://127.0.0.1:5043/health' -UseBasicParsing -TimeoutSec 2
              if ($resp.StatusCode -eq 200) {
                Write-Host "/health OK (attempt $($i+1))"
                $ready = $true
                break
              }
              Write-Host "/health returned $($resp.StatusCode) (attempt $($i+1))"
            } catch {
              Write-Host "/health not ready (attempt $($i+1)): $($_.Exception.Message)"
            }
            Start-Sleep -Seconds 1
          }
          if (-not $ready) {
            Write-Error "Agent /health never returned 200 within 30s"
            # Dump agent log for diagnostics
            $logPath = 'C:\ProgramData\FingerprintAgent\Logs\agent.log'
            if (Test-Path $logPath) {
              Write-Host "--- Last 50 lines of $logPath ---"
              Get-Content $logPath -Tail 50
            }
            exit 1
          }

      # Install Playwright + Chromium. Pinning @playwright/test 1.55.1 per
      # RESEARCH.md §4 — Chromium 142+ requires additional local-network-access
      # launch flags we don't want to chase.
      - name: Install E2E dependencies
        working-directory: tests/FingerprintAgent.E2E
        run: |
          npm ci
          npx playwright install chromium

      # Mock backend is auto-started by Playwright's webServer config
      # (playwright.config.ts). webServer starts once per `playwright test`
      # invocation (NOT per worker), and reuseExistingServer=false in CI means
      # any leftover process bound to port 8080 will fail this run fast.
      - name: Run Playwright tests
        working-directory: tests/FingerprintAgent.E2E
        run: npx playwright test

      # Always run cleanup so the next workflow run starts from a clean runner.
      # Uninstall via the MSI file path (NOT the ProductCode) — msiexec /x works
      # without us having to query WMI for the IdentifyingNumber.
      - name: Uninstall MSI (cleanup)
        if: always()
        shell: pwsh
        run: |
          # Same msiexec path restriction as the install step: absolute + backslashes.
          $msi = (Resolve-Path $env:MSI_PATH).Path
          Write-Host "Uninstalling MSI from $msi ..."
          $proc = Start-Process -FilePath 'msiexec.exe' `
            -ArgumentList "/x `"$msi`" /qn /l*v uninstall.log" `
            -Wait -PassThru -NoNewWindow
          Write-Host "msiexec uninstall exit code: $($proc.ExitCode)"
          if ($proc.ExitCode -ne 0) {
            # Cleanup failures must NOT mask a passing test suite. Log + warn so
            # the operator sees the issue in the workflow log without flipping
            # the overall job status from green to red.
            Write-Warning "MSI uninstall failed (exit code $($proc.ExitCode)). See uninstall.log. Manual cleanup may be required."
          }

      # Upload Playwright report for post-mortem analysis on test failures.
      # `if: always()` ensures we still get the report when tests fail.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: playwright-report
          path: tests/FingerprintAgent.E2E/playwright-report/
          retention-days: 14
          if-no-files-found: warn
