name: Release MSI

# CI builds MSI on tag push (v*). No local MSI build script exists.
# MSI is uploaded as a workflow artifact AND auto-attached to a GitHub
# Release (D-02 — internal tool, no code-signing cert required).

on:
  push:
    tags:
      - 'v*'
  # Allow operator-triggered manual build for ad-hoc testing
  workflow_dispatch:

# Concurrency: keep in-progress release builds, don't cancel
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Auto-create GitHub Release and attach MSI on tag push.
# Internal-tool deployment: no code-signing cert required (D-02 reversed
# for v1.1+ — trusted distribution not needed for hospital-internal MSI).
permissions:
  contents: write  # required to create releases / upload release assets

jobs:
  build-msi:
    name: Build FingerprintAgent-Setup.msi
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@9eae3fe338f7afea848fcd19cba99fdd34e92a62 # v4
        with:
          dotnet-version: '9.0.x'

      # Compute the MSI ProductVersion from the git tag (strip 'v' prefix)
      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
            $version = $tag -replace '^v', ''
            "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "MSI ProductVersion = $version"
          } else {
            # Manual dispatch or other — default to 0.0.0-dev
            "version=0.0.0-dev" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "MSI ProductVersion = 0.0.0-dev (manual run)"
          }

      - name: Restore solution
        run: dotnet restore FingerprintAgent.sln

      - name: Build solution (Release)
        run: dotnet build FingerprintAgent.sln -c Release --no-restore /p:Version=${{ steps.version.outputs.version }}

      - name: Run xUnit tests
        run: dotnet test tests/FingerprintAgent.Tests/FingerprintAgent.Tests.csproj -c Release --no-build --verbosity normal

      - name: Install WiX 3.14.1 toolchain
        uses: ./.github/actions/install-wix314

      - name: Build MSI
        # WixToolPath tells the legacy .wixproj where to find wix.targets/candle/light.
        run: dotnet build installer/FingerprintAgent.Installer.wixproj -c Release --no-restore /p:WixToolPath=C:\wix314 /p:Version=${{ steps.version.outputs.version }}

      - name: Verify MSI artifact
        shell: pwsh
        run: |
          $msiPath = "installer/bin/Release/FingerprintAgent-Setup.msi"
          if (-not (Test-Path $msiPath)) {
            Write-Error "MSI not found at $msiPath"
            exit 1
          }
          $size = (Get-Item $msiPath).Length
          Write-Host "MSI artifact: $msiPath ($size bytes)"
          if ($size -lt 100KB) {
            Write-Error "MSI suspiciously small ($size bytes) — likely empty"
            exit 1
          }

      - name: Upload MSI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: FingerprintAgent-Setup-${{ steps.version.outputs.version }}
          path: installer/bin/Release/FingerprintAgent-Setup.msi
          if-no-files-found: error
          retention-days: 30

      # Auto-attach MSI to GitHub Release on tag push (D-02 — internal tool,
      # no signing required). `if` skips manual workflow_dispatch runs that
      # don't have a v* tag to attach to.
      - name: Attach MSI to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/bin/Release/FingerprintAgent-Setup.msi
          generate_release_notes: true
